name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build and Release Morphe Patch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Kotlin Compiler
        run: |
          mkdir -p "$HOME/.local/kotlinc"
          curl -fSL -o /tmp/kotlinc.zip "https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip"
          unzip -q /tmp/kotlinc.zip -d /tmp/kotlinc_extracted
          cp -r /tmp/kotlinc_extracted/kotlinc/* "$HOME/.local/kotlinc/"
          echo "$HOME/.local/kotlinc/bin" >> $GITHUB_PATH

      - name: Make scripts executable
        run: chmod +x ./build.sh

      - name: Build Patch Package (.mpp)
        run: ./build.sh

      - name: Extract Release Tag Info
        id: tag_info
        run: |
          VERSION="$(grep -m1 '^version=' gradle.properties | cut -d'=' -f2 | tr -d ' ')"
          TAG="${GITHUB_REF_NAME:-v${VERSION}}"
          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "Release tag ${TAG} does not match project version ${VERSION}." >&2
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Notes
        run: |
          cat << 'EOF' > release-notes.md
          ### Gboard Customizations

          #### ✨ Features
          - Customize glide typing trail color, including a color wheel and rainbow mode.
          - Adjust trail fade duration, width, and point retention.
          - Optionally promote suggestions written in a different Unicode script. This best-effort
            heuristic affects glide and ordinary suggestion rows and cannot distinguish languages
            that use the same script.
          - Manage WMKeyboard `.wmicons`/ZIP imports and icon replacement from Theme Builder; the
            separate Keyboard Icon Packs patch depends on Theme Builder. Icon lookup prioritizes
            Gboard key metadata, then uses a fallback search for a visible key image view. Slots
            without a known Gboard match are left unchanged. Active icon packs can be exported in
            WMKeyboard-compatible format.
          - Replace the legacy theme editor with Gboard Theme Builder. Create native Gboard themes,
            import RBoard `.pack`, native theme `.zip`, and WMKeyboard `.wmtheme.json` packages,
            preserve compatible native CSS stylesheets/flavors, and export a native theme ZIP.
            Edit key-label fonts (TTF/OTF), per-key colors, shapes, textures, opacity, icon tint/custom icons, modifiers, and
            spacebar appearance. Import multiple sticker images and include them in theme JSON
            exports. Font files are included in theme JSON, not native ZIPs. Visual profiles retain
            Gboard's key positions and actions.
            These hooks depend on Gboard internals and are not guaranteed across versions.
          - Apply a pure-black AMOLED style to AndroidX preference rows across Gboard settings,
            including settings introduced by other patches. Custom screens that do not use
            AndroidX Preference rows are not covered. The row-binding hook tolerates an
            obfuscated binder method name when its PreferenceViewHolder signature remains.
          - Edit modifier-key and spacebar background/text colors, and apply per-key spacebar styles.
            Imported icon packs are managed in Theme Builder and are not embedded into theme exports.
            Saved themes can be deleted from Theme Builder; deleting the active theme restores the
            system theme.
          - Remove the experimental XGesture patch and its gesture, drawing, snippet, and macro
            features from the bundle.
          - Patch and sign successfully against Gboard 18.5.6.993608717-release-arm64-v8a; visual
            rendering still requires device verification and compatibility is not guaranteed for
            other Gboard versions.
          - Fix native stylesheet registration so generated theme colors are loaded by Gboard, and
            enable imported icon packs while improving icon visibility and Logcat diagnostics.
          - Patches are exposed as experimental targets without a fixed Gboard version allowlist.
          - Fix preference-listener proxy return types that could crash Gboard Settings when
            toggling switches.

          #### 📱 Add to Morphe App
          1. Open the **Morphe** app on your Android device.
          2. Navigate to **Settings** -> **Sources**.
          3. Tap **Add Source** and paste:
             ```
             https://github.com/${{ github.repository }}
             ```
          4. Return to **Patcher**, select Gboard and the desired patch, then patch!
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG }}
          name: Release ${{ steps.tag_info.outputs.TAG }}
          body_path: release-notes.md
          prerelease: false
          files: |
            dist/patches-${{ steps.tag_info.outputs.VERSION }}.mpp
            patches-bundle.json
            patches-list.json
